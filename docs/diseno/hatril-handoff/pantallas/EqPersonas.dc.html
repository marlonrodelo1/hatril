<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Equipo · Todo el equipo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
h1,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.p{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-top:1px solid #E0DFDB;background:#FFFFFF;min-height:60px}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;align-self:flex-start}
.cb{width:44px;height:44px;border-radius:999px;border:1px solid #E0DFDB;background:#FFFFFF;color:#3D3D3A;display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none}
</style>
</helmet>
<div style="width: 375px; height: 1000px; position: relative; overflow: hidden; background: #FAF9F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #141413; padding: 47px 0 34px; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
    <a href="EqLleva.dc.html" aria-label="Volver a Alabanza" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #141413"><svg class="ic" width="22" height="22" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em">Alabanza · 12 personas</h1>
  </div>
  <p style="margin: 0 16px 14px; padding: 12px 14px; border-radius: 8px; background: #F5F4ED; display: flex; gap: 10px; font-size: 13px; line-height: 1.45; color: #3D3D3A">
    <svg class="ic" width="16" height="16" viewBox="0 0 24 24" style="margin-top: 1px"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>Los teléfonos solo los ven Sara y tú, que llevan el equipo.</span>
  </p>

  <div role="list" style="border-bottom: 1px solid #E0DFDB">
    <sc-for list="{{ gente }}" as="p" hint-placeholder-count="12">
      <div class="p" role="listitem">
        <span class="av" style="{{ p.av }}">{{ p.ini }}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">{{ p.n }}</span>
          <span style="font-size: 13px; color: #67665F">{{ p.puesto }}</span>
          <sc-if value="{{ p.hayRol }}" hint-placeholder-val="{{ false }}"><span class="chip" style="{{ p.rolSt }}">{{ p.rol }}</span></sc-if>
        </span>
        <sc-if value="{{ p.otro }}" hint-placeholder-val="{{ true }}">
          <a href="#" class="cb" aria-label="{{ p.llamar }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></a>
          <a href="#" class="cb" aria-label="{{ p.wa }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></a>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['SG','Sara Gil','Voz principal','Responsable','#E6ECDE','#245C0E'],
      ['LH','Lucía Hernández (tú)','Teclado','Colíder','#E3E8EC','#2F4A5C'],
      ['JM','Juan Mora','Guitarra',null,'#F3E9D3','#734500'],
      ['PD','Pedro Díaz','Batería',null,'#ECE3EE','#5B3A66'],
      ['TL','Tomás León','Bajo',null,'#F3E9D3','#734500'],
      ['MR','Marta Ruiz','Voz',null,'#F5E7DF','#92442A'],
      ['ER','Elena Ruiz','Voz',null,'#E6ECDE','#245C0E'],
      ['CP','Carlos Pérez','Voz y guitarra',null,'#E3E8EC','#2F4A5C'],
      ['AD','Ana Díaz','Voz',null,'#ECE3EE','#5B3A66'],
      ['IR','Inés Rubio','Violín',null,'#F5E7DF','#92442A'],
      ['GM','Gabriel Mesa','Sonido',null,'#E7E4DB','#3D3D3A'],
      ['NV','Noelia Vera','Proyección',null,'#E6ECDE','#245C0E']
    ];
    return {
      gente: P.map((x) => ({
        ini: x[0], n: x[1], puesto: x[2], hayRol: !!x[3], rol: x[3] || '',
        rolSt: x[3] === 'Responsable' ? { background: '#F5E7DF', color: '#92442A' } : { background: '#F0EEE6', color: '#5E5D58' },
        av: { width: '40px', height: '40px', background: x[4], color: x[5], fontSize: '13px' },
        otro: x[1].indexOf('(tú)') < 0,
        llamar: 'Llamar a ' + x[1], wa: 'WhatsApp a ' + x[1]
      }))
    };
  }
}
</script>
</body>
</html>
