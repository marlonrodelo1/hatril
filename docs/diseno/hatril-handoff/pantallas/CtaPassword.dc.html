<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi cuenta · Cambiar la contraseña</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
h1,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lbl{font-size:14px;font-weight:600}
.fld{width:100%;height:48px;padding:0 48px 0 14px;font-family:inherit;font-size:16px;color:#141413;background:#F5F4ED;border:1px solid #E0DFDB;border-radius:8px}
.f{display:flex;flex-direction:column;gap:6px}
.eye{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:transparent;color:#67665F;display:flex;align-items:center;justify-content:center}
.rule{display:flex;align-items:center;gap:8px;font-size:13px}
.ok{width:18px;height:18px;border-radius:999px;background:#3D3D3A;color:#FFFFFF;display:flex;align-items:center;justify-content:center}
.no{width:18px;height:18px;border-radius:999px;border:1.5px solid #67665F}
</style>
</helmet>
<div style="width: 375px; height: 812px; position: relative; overflow: hidden; background: #FAF9F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #141413; padding: 47px 0 34px; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
    <a href="CtaMiCuenta.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #141413"><svg class="ic" width="22" height="22" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em">Cambiar la contraseña</h1>
  </div>

  <form style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div class="f">
      <label for="pa" class="lbl">Contraseña actual</label>
      <div style="position: relative"><input id="pa" class="fld" type="password" autocomplete="current-password" value="contraseña"><button type="button" class="eye" aria-label="Mostrar contraseña"><svg class="ic" width="18" height="18" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <a href="PRecuperar.dc.html" style="align-self: flex-end; font-size: 14px; font-weight: 700; color: #141413; text-decoration: none; padding: 6px 0">La he olvidado</a>
    </div>
    <div class="f">
      <label for="pn" class="lbl">Contraseña nueva</label>
      <div style="position: relative"><input id="pn" class="fld" type="password" autocomplete="new-password" value="Betania" aria-describedby="rgl"><button type="button" class="eye" aria-label="Mostrar contraseña"><svg class="ic" width="18" height="18" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <ul id="rgl" style="list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
        <li class="rule" style="color: #67665F"><span class="no"></span>8 caracteres o más</li>
        <li class="rule"><span class="ok"><svg class="ic" width="11" height="11" viewBox="0 0 24 24" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>Una mayúscula y una minúscula</li>
        <li class="rule" style="color: #67665F"><span class="no"></span>Un número</li>
      </ul>
    </div>
  </form>

  <div style="flex: 1"></div>
  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <button disabled aria-disabled="true" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; border: 0; background: #B15435; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; opacity: 0.45">Cambiar la contraseña</button>
    <p style="font-size: 12px; color: #67665F; text-align: center">Se cerrará la sesión en tus otros dispositivos.</p>
  </div>
</div>
