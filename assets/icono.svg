<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    El icono de Hatril. Fuente de verdad: los PNG de al lado, el arranque, todos
    los tamaños de Android e iOS y los iconos de la web salen de aquí con
    `npm run app:iconos`. A 16 y 32 px no: ahí mandan favicon-16.svg y
    favicon-32.svg, dibujados a mano en la rejilla de píxel.

    Es la propuesta 3-b de la marca, «el atril, de pie» (20-oct-2026): la «t» de
    Hatril hecha atril, con pie, columna, pupitre y la Biblia abierta encima.
    Copiado tal cual de Versiones/marca/final/icono-app.svg.

    Cuadrado entero, sin esquinas: las redondea cada sistema con su máscara.
    Naranja quemado de la marca (#B15435) y el atril en blanco, sin degradados
    ni sombras, simétrico y con la columna en x = 512. Cabe dentro del círculo
    del 66 %, que es lo que deja ver el icono adaptable de Android con
    cualquier máscara.
  -->
  <rect width="1024" height="1024" fill="#B15435"/>
