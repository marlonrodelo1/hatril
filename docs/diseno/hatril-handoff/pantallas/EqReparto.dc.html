<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Equipo · Reparto de hoy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
h1,h2,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;border:2px solid #FFFFFF;margin-left:-8px}
.fam{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 16px;border:0;border-top:1px solid #E0DFDB;font-family:inherit;text-align:left;cursor:pointer;color:#141413}
.ck{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
</style>
</helmet>
<div style="width: 375px; height: 1000px; position: relative; overflow: hidden; background: #FAF9F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #141413; padding: 47px 0 34px; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
    <a href="#" aria-label="Volver a Acción social" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #141413"><svg class="ic" width="22" height="22" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
    <span style="flex: 1; display: flex; flex-direction: column"><h1 style="font-size: 17px; font-weight: 800">Reparto de hoy</h1><span style="font-size: 12px; color: #67665F">Acción social · 10:00 a 13:00 · local de la calle Anchieta</span></span>
  </div>

  <div style="margin: 6px 16px 0; padding: 16px; background: #FFFFFF; border: 1px solid #E0DFDB; border-radius: 12px; display: flex; flex-direction: column; gap: 10px">
    <p style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em" aria-live="polite">{{ cuenta }}</p>
    <div style="height: 8px; border-radius: 999px; background: #F0EEE6; overflow: hidden" aria-hidden="true"><div style="{{ barra }}"></div></div>
    <div style="display: flex; align-items: center; gap: 10px; padding-top: 4px">
      <span style="display: flex; padding-left: 8px">
        <span class="av" style="width: 30px; height: 30px; background: #E3E8EC; color: #2F4A5C; font-size: 10px">RM</span>
        <span class="av" style="width: 30px; height: 30px; background: #ECE3EE; color: #5B3A66; font-size: 10px">CR</span>
        <span class="av" style="width: 30px; height: 30px; background: #E7E4DB; color: #3D3D3A; font-size: 10px">PS</span>
      </span>
      <span style="font-size: 13px; color: #67665F">Hoy están Rosa, Carmen y Pilar</span>
    </div>
  </div>

  <div style="padding: 16px 16px 10px; position: relative">
    <label for="bf" style="position: absolute; left: -9999px">Buscar familia</label>
    <svg class="ic" width="18" height="18" viewBox="0 0 24 24" style="position: absolute; left: 30px; top: 31px; color: #67665F"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="bf" type="search" placeholder="Buscar por apellido o número" style="width: 100%; height: 48px; padding: 0 14px 0 42px; font-family: inherit; font-size: 16px; background: #F5F4ED; border: 1px solid #E0DFDB; border-radius: 8px">
  </div>

  <div style="display: flex; justify-content: space-between; padding: 0 16px 8px"><span style="font-size: 12px; font-weight: 700; color: #67665F; text-transform: uppercase; letter-spacing: 0.06em">Faltan por venir primero</span><span style="font-size: 12px; color: #67665F">Toca al entregar</span></div>
  <div role="group" aria-label="Familias" style="border-bottom: 1px solid #E0DFDB">
    <sc-for list="{{ familias }}" as="f" hint-placeholder-count="8">
      <button class="fam" role="checkbox" aria-checked="{{ f.aria }}" onClick="{{ f.t }}" style="{{ f.row }}">
        <span style="width: 40px; font-size: 13px; font-weight: 800; color: #67665F">{{ f.num }}</span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{ f.n }}</span><span style="font-size: 13px; color: #67665F">{{ f.s }}</span></span>
        <span class="ck" style="{{ f.ck }}"><sc-if value="{{ f.on }}" hint-placeholder-val="{{ false }}"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></sc-if></span>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 16px 16px 0">
    <a href="#" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #B15435; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Cerrar el reparto de hoy</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: { 5: true, 6: true, 7: true } }; }
  renderVals() {
    const F = [
      ['#012', 'Familia Afonso Díaz', '4 personas · con bebé'],
      ['#017', 'Familia Cabrera', '2 personas'],
      ['#023', 'Familia Mejía Rojas', '5 personas'],
      ['#031', 'Familia González', '3 personas · sin gluten'],
      ['#038', 'Familia Hernández Ramos', '6 personas'],
      ['#004', 'Familia Pérez', '2 personas'],
      ['#009', 'Familia Toledo Martín', '4 personas'],
      ['#015', 'Familia Ruiz', '1 persona']
    ];
    const s = this.state.on;
    const base = 29;
    const familias = F.map((x, i) => {
      const on = !!s[i];
      return {
        num: x[0], n: x[1], s: x[2], on, aria: on ? 'true' : 'false',
        row: { background: on ? '#E6ECDE' : '#FFFFFF' },
        ck: on ? { background: '#245C0E', color: '#FFFFFF' } : { border: '1.5px solid #67665F' },
        t: () => this.setState({ on: Object.assign({}, s, { [i]: !on }) })
      };
    });
    const n = base + familias.filter((f) => f.on).length;
    return {
      familias,
      cuenta: n + ' de 45 familias atendidas',
      barra: { height: '100%', borderRadius: '999px', background: '#245C0E', width: Math.round(n / 45 * 100) + '%' }
    };
  }
}
</script>
</body>
</html>
