<!doctype html>
<html lang="es">
<head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
h1,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lbl{font-size:14px;font-weight:600}
.opt{font-weight:500;color:#67665F}
.fld{width:100%;height:48px;padding:0 14px;font-family:inherit;font-size:16px;color:#141413;background:#F5F4ED;border:1px solid #E0DFDB;border-radius:8px}
.f{display:flex;flex-direction:column;gap:6px}
.tonos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tonos span{height:44px;border-radius:8px;border:1px solid #E0DFDB;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.tonos span.on{background:#3D3D3A;border-color:#3D3D3A;color:#FFFFFF}
</style>
</helmet>
<div style="width: 375px; height: 900px; position: relative; overflow: hidden; background: #FAF9F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #141413; padding: 47px 0 34px; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
    <a href="EqRepertorio.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #141413"><svg class="ic" width="22" height="22" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
    <h1 style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em">Apuntar una canción</h1>
  </div>

  <form style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div class="f"><label for="ti" class="lbl">Título</label><input id="ti" class="fld" value="Castillo fuerte es nuestro Dios"></div>
    <div class="f">
      <span class="lbl" id="tl">Tono del equipo</span>
      <div class="tonos" role="radiogroup" aria-labelledby="tl">
        <span role="radio" aria-checked="true" class="on">Do</span><span role="radio" aria-checked="false">Re</span><span role="radio" aria-checked="false">Mi</span><span role="radio" aria-checked="false">Fa</span><span role="radio" aria-checked="false">Sol</span><span role="radio" aria-checked="false">La</span>
        <span role="radio" aria-checked="false">Si</span><span role="radio" aria-checked="false">Do#</span><span role="radio" aria-checked="false">Mib</span><span role="radio" aria-checked="false">Fa#</span><span role="radio" aria-checked="false">Lab</span><span role="radio" aria-checked="false">Sib</span>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; padding-top: 4px"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #3D3D3A">Es en tono menor</label>
    </div>
    <div class="f"><label for="en" class="lbl">Enlace para escucharla <span class="opt">(opcional)</span></label><input id="en" class="fld" type="url" placeholder="https://youtube.com/…"></div>
    <div class="f"><label for="le" class="lbl">Letra o acordes <span class="opt">(opcional)</span></label><textarea id="le" rows="5" placeholder="Pega aquí la letra con los acordes encima" style="padding: 12px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 16px; line-height: 1.4; color: #141413; background: #F5F4ED; border: 1px solid #E0DFDB; border-radius: 8px; resize: none"></textarea></div>
  </form>

  <div style="flex: 1"></div>
  <div style="padding: 16px 16px 0">
    <a href="EqRepertorio.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #B15435; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Guardar en el repertorio</a>
  </div>
</div>
</x-dc>

</html>
