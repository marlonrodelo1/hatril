<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Equipo · Pasar lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
h1,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.pp{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;border:0;border-top:1px solid #E0DFDB;font-family:inherit;text-align:left;cursor:pointer;color:#141413}
.ck{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
</style>
</helmet>
<div style="width: 375px; height: 900px; position: relative; overflow: hidden; background: #FAF9F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #141413; padding: 47px 0 34px; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
    <a href="EqAgenda.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #141413"><svg class="ic" width="22" height="22" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
    <span style="flex: 1; display: flex; flex-direction: column"><h1 style="font-size: 17px; font-weight: 800">Pasar lista</h1><span style="font-size: 12px; color: #67665F">Ensayo · hoy, viernes 30</span></span>
  </div>

  <div style="margin: 4px 16px 10px; display: flex; align-items: center; justify-content: space-between">
    <p style="font-size: 20px; font-weight: 800; letter-spacing: -0.015em" aria-live="polite">{{ cuenta }}</p>
    <span style="font-size: 13px; color: #67665F">Toca a quien ha venido</span>
  </div>

  <div role="group" aria-label="Personas del equipo" style="border-bottom: 1px solid #E0DFDB; background: #FFFFFF">
    <sc-for list="{{ gente }}" as="p" hint-placeholder-count="12">
      <button class="pp" role="checkbox" aria-checked="{{ p.aria }}" onClick="{{ p.t }}" style="{{ p.row }}">
        <span class="av" style="{{ p.av }}">{{ p.ini }}</span>
        <span style="flex: 1; font-size: 15px; font-weight: 700">{{ p.n }}</span>
        <span class="ck" style="{{ p.ck }}"><sc-if value="{{ p.on }}" hint-placeholder-val="{{ false }}"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></sc-if></span>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 14px 16px 0">
    <a href="EqAgenda.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #B15435; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Guardar la lista</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: { 0: true, 1: true, 3: true, 4: true, 7: true } }; }
  renderVals() {
    const P = [['SG','Sara Gil','#E6ECDE','#245C0E'],['LH','Lucía Hernández (tú)','#E3E8EC','#2F4A5C'],['JM','Juan Mora','#F3E9D3','#734500'],['PD','Pedro Díaz','#ECE3EE','#5B3A66'],['MR','Marta Ruiz','#F5E7DF','#92442A'],['ER','Elena Ruiz','#E6ECDE','#245C0E'],['CP','Carlos Pérez','#E3E8EC','#2F4A5C'],['AD','Ana Díaz','#ECE3EE','#5B3A66'],['TL','Tomás León','#F3E9D3','#734500'],['IR','Inés Rubio','#F5E7DF','#92442A'],['GM','Gabriel Mesa','#E7E4DB','#3D3D3A'],['NV','Noelia Vera','#E6ECDE','#245C0E']];
    const s = this.state.on;
    const gente = P.map((x, i) => {
      const on = !!s[i];
      return {
        ini: x[0], n: x[1], on, aria: on ? 'true' : 'false',
        av: { width: '36px', height: '36px', background: x[2], color: x[3], fontSize: '12px' },
        row: { background: on ? '#E6ECDE' : '#FFFFFF' },
        ck: on ? { background: '#245C0E', color: '#FFFFFF' } : { border: '1.5px solid #67665F' },
        t: () => this.setState({ on: Object.assign({}, s, { [i]: !on }) })
      };
    });
    const n = gente.filter((g) => g.on).length;
    return { gente, cuenta: 'Vinieron ' + n + ' de ' + P.length };
  }
}
</script>
</body>
</html>
