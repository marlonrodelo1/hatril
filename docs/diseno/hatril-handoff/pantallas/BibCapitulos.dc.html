<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Biblia · Elegir capítulo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
h2,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.caps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cap{height:48px;border-radius:8px;border:1px solid #E0DFDB;background:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;color:#141413;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.sheet{animation:up 280ms cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>
</helmet>
<div style="width: 375px; height: 812px; position: relative; overflow: hidden; background: #FAF9F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #141413">
  <div aria-hidden="true" style="padding: 120px 22px 0; font-size: 19px; line-height: 1.75; color: #141413">Jehová es mi pastor; nada me faltará. En lugares de delicados pastos me hará yacer…</div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,20,19,0.42)"></div>

  <section class="sheet" role="dialog" aria-label="Elegir capítulo de Salmos" style="position: absolute; left: 0; right: 0; bottom: 0; height: 680px; background: #FFFFFF; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 36px; height: 4px; border-radius: 999px; background: #E0DFDB"></span></div>
    <div style="display: flex; align-items: center; padding: 8px 8px 12px 20px">
      <h2 style="flex: 1; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Salmos</h2>
      <a href="BibIndice.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 10px; font-size: 14px; font-weight: 700; color: #141413; text-decoration: none">Otro libro<svg class="ic" width="16" height="16" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
    </div>
    <div style="padding: 0 16px 34px; overflow: hidden">
      <div class="caps" role="list">
        <sc-for list="{{ caps }}" as="c" hint-placeholder-count="60">
          <a href="BibCapitulo.dc.html" class="cap" role="listitem" aria-current="{{ c.cur }}" style="{{ c.st }}">{{ c.n }}</a>
        </sc-for>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const caps = [];
    for (let i = 1; i <= 150; i++) {
      const cur = i === 23;
      caps.push({ n: i, cur: cur ? 'true' : 'false', st: cur ? { background: '#3D3D3A', color: '#FFFFFF', borderColor: '#3D3D3A' } : {} });
    }
    return { caps };
  }
}
</script>
</body>
</html>
