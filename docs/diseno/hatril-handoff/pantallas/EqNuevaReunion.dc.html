<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Equipo · Apuntar un ensayo o reunión</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
h1,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lbl{font-size:14px;font-weight:600}
.opt{font-weight:500;color:#67665F}
.fld{width:100%;height:48px;padding:0 14px;font-family:inherit;font-size:16px;color:#141413;background:#F5F4ED;border:1px solid #E0DFDB;border-radius:8px}
.f{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:#F0EEE6;border-radius:999px}
.seg span{height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#5E5D58}
.seg span.on{background:#FFFFFF;color:#141413;border:1px solid #E0DFDB}
.sw{width:52px;height:32px;border-radius:999px;background:#3D3D3A;padding:3px;display:flex;justify-content:flex-end;flex:none}
.sw i{display:block;width:26px;height:26px;border-radius:999px;background:#FFFFFF}
</style>
</helmet>
<div style="width: 375px; height: 900px; position: relative; overflow: hidden; background: #FAF9F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #141413; padding: 47px 0 34px; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; padding: 0 6px">
    <a href="EqAgenda.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #141413"><svg class="ic" width="22" height="22" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
    <h1 style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em">Apuntar en la agenda</h1>
  </div>

  <form style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div class="seg" role="radiogroup" aria-label="Tipo"><span class="on" role="radio" aria-checked="true">Ensayo</span><span role="radio" aria-checked="false">Reunión</span></div>
    <div class="f"><label for="t" class="lbl">Título <span class="opt">(opcional)</span></label><input id="t" class="fld" placeholder="Ensayo"></div>
    <div class="f"><label for="d" class="lbl">Día</label><input id="d" class="fld" value="Viernes 13 de noviembre"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div class="f"><label for="h1" class="lbl">Empieza</label><input id="h1" class="fld" value="20:00"></div>
      <div class="f"><label for="h2" class="lbl">Acaba <span class="opt">(opcional)</span></label><input id="h2" class="fld" value="21:30"></div>
    </div>
    <div class="f"><label for="l" class="lbl">Dónde</label><input id="l" class="fld" value="Sala de música"></div>
    <div class="f"><label for="n" class="lbl">Nota para el equipo <span class="opt">(opcional)</span></label><textarea id="n" rows="2" placeholder="Qué traer, qué repasar…" style="padding: 12px 14px; font-family: inherit; font-size: 16px; line-height: 1.4; color: #141413; background: #F5F4ED; border: 1px solid #E0DFDB; border-radius: 8px; resize: none"></textarea></div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; display: flex; flex-direction: column"><span id="rep" style="font-size: 15px; font-weight: 700">Se repite cada semana</span><span style="font-size: 13px; color: #67665F">Los viernes, hasta que lo quites</span></span>
      <span class="sw" role="switch" aria-checked="true" aria-labelledby="rep"><i></i></span>
    </div>
  </form>

  <div style="flex: 1"></div>
  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <a href="EqAgenda.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #B15435; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Guardar y avisar al equipo</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
